<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Angielski</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span>Angielski</span></h1>
      <p>Angielskie słownictwo i gramatyka od A1 do C1, z powtórkami w odstępach.</p>
      <p class="syncnote" id="sync" data-state="local">Postęp zapisuje się tylko w tej przeglądarce.</p>
    </div>
    <div class="today" id="today"></div>
    <div class="mchips">
      <span class="streakchip" id="mstreak"></span>
      <span class="lvlchip"><select id="mlevel" aria-label="Poziom"></select><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
    </div>
  </header>

  <div class="controls">
    <div class="pickers">
      <div class="pick"><span class="pick-label">Poziom</span><div class="seg" id="levels" role="group" aria-label="Poziom"></div></div>
    </div>
    <div class="pick"><span class="pick-label">Sekcja</span><div class="seg" id="sections" role="group" aria-label="Sekcja"></div></div>
  </div>
  <div class="controls">
    <div class="pick"><span class="pick-label">Ćwiczenie</span><div class="seg" id="modes" role="group" aria-label="Ćwiczenie"></div></div>
    <button class="dir" id="dir" type="button" title="Zmień kierunek tłumaczenia"></button>
  </div>

  <div class="main">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside id="side"></aside>
  </div>
</div>

<nav class="mnav" aria-label="Główne">
  <button type="button" data-tab="today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Dziś</button>
  <button type="button" data-tab="practice"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Ćwicz</button>
  <button type="button" data-tab="progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Postęp</button>
  <button type="button" data-tab="profile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
</nav>

<script src="js/data/words.js"></script>
<script src="js/data/irregular.js"></script>
<script src="js/data/word-formation.js"></script>
<script src="js/data/sentences.js"></script>
<script src="js/data/phrasal.js"></script>
<script src="js/data/texts.js"></script>
<script src="js/data/chat.js"></script>
<script src="js/data/grammar.js"></script>
<script src="js/i18n-en.js"></script>
<script src="js/app.js"></script>
</body>
</html>
